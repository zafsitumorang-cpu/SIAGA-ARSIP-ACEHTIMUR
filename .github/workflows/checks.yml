name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment script syntax
        run: |
          for script in scripts/auto-deploy.sh scripts/install-auto-deploy.sh scripts/install-backup-timer.sh; do
            bash -n "$script"
          done
          node --check public/app.js
          node --check public/archive-editor.js
          node --check public/archive-search.js
      - run: npm run uat
      - run: npm run test:migration
      - run: npm run test:query
      - run: npm run test:security
        env:
          PG_TEST_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
      - run: node scripts/database-tests.mjs
        env:
          PG_TEST_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
      - run: npm audit --omit=dev
